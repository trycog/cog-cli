name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Check formatting
        run: zig fmt --check src build.zig build.zig.zon

      - name: Test release validation
        run: ./test/release/validate-release.sh

  test:
    needs: fmt
    strategy:
      matrix:
        include:
          - os: ubuntu-latest       # x86_64 Linux
          - os: ubuntu-24.04-arm    # aarch64 Linux
          - os: macos-15            # aarch64 macOS; newer images default to an SDK Zig 0.15 cannot link
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2


      - name: Select an Xcode SDK compatible with Zig 0.15
        if: runner.os == 'macOS'
        run: |
          xc=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$xc" ]; then
            echo "No Xcode 16.x on this image; Zig 0.15.2 cannot link against newer SDKs" >&2
            ls -d /Applications/Xcode*.app >&2 || true
            exit 1
          fi
          echo "Selecting $xc"
          sudo xcode-select -s "$xc"
          echo "DEVELOPER_DIR=$xc/Contents/Developer" >> "$GITHUB_ENV"

      - name: Download grammars
        run: zig build setup
        env:
          COG_GRAMMAR_LOCK_TRACE: 1

      - name: Run tests
        run: zig build test

      - name: Run Windows cross-compilation gate
        run: zig build test-windows-cross

      - name: Run indexing integration tests
        run: zig build test-indexing-integration

      - name: Run deterministic indexing benchmark gate
        run: zig build test-indexing-benchmark
