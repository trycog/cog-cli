name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Check formatting
        run: zig fmt --check src build.zig build.zig.zon

      - name: Test release validation
        run: ./test/release/validate-release.sh

  test:
    needs: fmt
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest       # x86_64 Linux
          - os: ubuntu-24.04-arm    # aarch64 Linux
          - os: macos-15            # aarch64 macOS; newer images default to an SDK Zig 0.15 cannot link
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
          # Temporarily disabled: the restored caches were saved by runs whose
          # test step crashed or hung, so rule out cache poisoning while
          # diagnosing the aarch64 test-step hang.
          use-cache: false


      - name: Select an Xcode SDK compatible with Zig 0.15
        if: runner.os == 'macOS'
        run: |
          xc=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$xc" ]; then
            echo "No Xcode 16.x on this image; Zig 0.15.2 cannot link against newer SDKs" >&2
            ls -d /Applications/Xcode*.app >&2 || true
            exit 1
          fi
          echo "Selecting $xc"
          sudo xcode-select -s "$xc"
          echo "DEVELOPER_DIR=$xc/Contents/Developer" >> "$GITHUB_ENV"

      - name: Download grammars
        run: zig build setup
        env:
          COG_GRAMMAR_LOCK_TRACE: 1

      - name: Run tests
        run: zig build test
        timeout-minutes: 10

      - name: Dump hung test processes
        if: failure() && runner.os == 'Linux'
        run: |
          sudo apt-get install -y -qq gdb >/dev/null 2>&1 || true
          echo "=== process tree ==="
          ps auxww --forest || true
          for pid in $(pgrep -x test); do
            echo "=== kernel stacks for test pid $pid ==="
            for tid in /proc/$pid/task/*; do
              echo "--- tid ${tid##*/} wchan=$(cat "$tid/wchan" 2>/dev/null)"
              sudo cat "$tid/stack" 2>/dev/null || true
            done
            echo "=== gdb backtrace for test pid $pid ==="
            sudo timeout 30 gdb -p "$pid" -batch -ex "thread apply all bt" 2>/dev/null | head -120 || true
          done

      - name: Run Windows cross-compilation gate
        run: zig build test-windows-cross

      - name: Run indexing integration tests
        run: zig build test-indexing-integration

      - name: Run deterministic indexing benchmark gate
        run: zig build test-indexing-benchmark
