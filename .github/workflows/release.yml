name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Validate release metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./scripts/validate-release.sh "$RELEASE_TAG"

      - name: Test release validator
        run: ./test/release/validate-release.sh

  ci:
    needs: validate
    strategy:
      matrix:
        include:
          - os: ubuntu-latest       # x86_64 Linux
          - os: ubuntu-24.04-arm    # aarch64 Linux
          - os: macos-15            # aarch64 macOS; newer images default to an SDK Zig 0.15 cannot link
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2


      - name: Select an Xcode SDK compatible with Zig 0.15
        if: runner.os == 'macOS'
        run: |
          xc=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$xc" ]; then
            echo "No Xcode 16.x on this image; Zig 0.15.2 cannot link against newer SDKs" >&2
            ls -d /Applications/Xcode*.app >&2 || true
            exit 1
          fi
          echo "Selecting $xc"
          sudo xcode-select -s "$xc"
          echo "DEVELOPER_DIR=$xc/Contents/Developer" >> "$GITHUB_ENV"

      - name: Download grammars
        run: zig build setup

      - name: Run tests
        run: zig build test

      - name: Run indexing integration tests
        run: zig build test-indexing-integration

  build:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2

      - name: Download grammars
        run: zig build setup

      - name: Build release tarballs
        run: zig build release

      - name: Upload release tarballs
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-tarballs
          path: zig-out/release/cog-*.tar.gz
          if-no-files-found: error
          compression-level: 0

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Download release tarballs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-tarballs
          path: tarballs

      - name: Validate release artifacts and extract changelog
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./scripts/validate-release.sh "$RELEASE_TAG" tarballs release-notes.md

      - name: Generate SHA-256 checksums
        working-directory: tarballs
        run: sha256sum cog-*.tar.gz > SHA256SUMS

      - name: Generate build provenance
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            tarballs/cog-darwin-arm64.tar.gz
            tarballs/cog-linux-arm64.tar.gz
            tarballs/cog-linux-x86_64.tar.gz
            tarballs/SHA256SUMS

      - name: Stage provenance bundle
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" tarballs/cog-build-provenance.json

      - name: Verify build provenance and release checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_DIGEST: ${{ github.sha }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SIGNER_WORKFLOW: ${{ github.repository }}/.github/workflows/release.yml
        run: ./scripts/validate-release.sh "$RELEASE_TAG" tarballs release-notes.md tarballs/cog-build-provenance.json

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          draft: true
          fail_on_unmatched_files: true
          files: |
            tarballs/cog-darwin-arm64.tar.gz
            tarballs/cog-linux-arm64.tar.gz
            tarballs/cog-linux-x86_64.tar.gz
            tarballs/SHA256SUMS
            tarballs/cog-build-provenance.json

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: ${{ github.ref_name }}
          body_path: release-notes.md

  update-tap:
    needs: [build, release]
    runs-on: ubuntu-latest
    steps:
      - name: Download release tarballs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-tarballs
          path: tarballs

      - name: Compute SHA256 hashes
        id: hashes
        run: |
          echo "darwin_arm64=$(sha256sum tarballs/cog-darwin-arm64.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "linux_arm64=$(sha256sum tarballs/cog-linux-arm64.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "linux_x86_64=$(sha256sum tarballs/cog-linux-x86_64.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Check out Homebrew tap
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: trycog/homebrew-tap
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          path: homebrew-tap
          persist-credentials: true

      - name: Update formula
        env:
          VERSION: ${{ github.ref_name }}
          SHA_DARWIN_ARM64: ${{ steps.hashes.outputs.darwin_arm64 }}
          SHA_LINUX_ARM64: ${{ steps.hashes.outputs.linux_arm64 }}
          SHA_LINUX_X86_64: ${{ steps.hashes.outputs.linux_x86_64 }}
        run: |
          SEMVER="${VERSION#v}"

          cat > homebrew-tap/Formula/cog.rb << FORMULA
          class Cog < Formula
            desc "Memory, code intelligence, and debugging for AI agents"
            homepage "https://github.com/trycog/cog-cli"
            version "${SEMVER}"
            license "MIT"

            on_macos do
              on_arm do
                url "https://github.com/trycog/cog-cli/releases/download/${VERSION}/cog-darwin-arm64.tar.gz"
                sha256 "${SHA_DARWIN_ARM64}"
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/trycog/cog-cli/releases/download/${VERSION}/cog-linux-arm64.tar.gz"
                sha256 "${SHA_LINUX_ARM64}"
              end
              on_intel do
                url "https://github.com/trycog/cog-cli/releases/download/${VERSION}/cog-linux-x86_64.tar.gz"
                sha256 "${SHA_LINUX_X86_64}"
              end
            end

            def install
              bin.install "cog"
            end

            test do
              output = shell_output("#{bin}/cog --help 2>&1")
              assert_match "Usage:", output
            end
          end
          FORMULA

      - name: Commit and push formula
        working-directory: homebrew-tap
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/cog.rb
          git commit -m "cog ${VERSION}"
          git push

  notify:
    needs: [release, update-tap]
    runs-on: ubuntu-latest
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Extract changelog and notify Discord
        if: ${{ env.DISCORD_WEBHOOK_URL != '' }}
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          SEMVER="${VERSION#v}"
          RELEASE_URL="https://github.com/trycog/cog-cli/releases/tag/${VERSION}"

          CHANGELOG=$(sed -n "/^## \[${SEMVER}\]/,/^## \[/{/^## \[${SEMVER}\]/d;/^## \[/d;p;}" CHANGELOG.md)

          DESCRIPTION=$(cat <<'INNEREOF'
          CHANGELOG_PLACEHOLDER

          **Update:**
          ```
          brew upgrade trycog/tap/cog
          ```
          or
          ```
          curl -fsSL https://trycog.ai/cli/install | bash
          ```
          INNEREOF
          )
          DESCRIPTION="${DESCRIPTION/CHANGELOG_PLACEHOLDER/$CHANGELOG}"

          PAYLOAD=$(jq -n \
            --arg title "Cog ${VERSION} Released" \
            --arg url "$RELEASE_URL" \
            --arg desc "$DESCRIPTION" \
            '{
              embeds: [{
                title: $title,
                url: $url,
                description: $desc,
                color: 65535
              }]
            }')

          curl -f -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$DISCORD_WEBHOOK_URL"
